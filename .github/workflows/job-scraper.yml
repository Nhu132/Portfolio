name: Job scraper

on:
  schedule:
    - cron: "7 1,7 * * *"   # 08:07 và 14:07 giờ VN mỗi ngày: bắt tin mới đăng sớm
  workflow_dispatch:       # nút "Run workflow" để chạy tay
  push:                    # sửa code/config thì chạy thử (không ghi Sheet)
    paths:
      - "job-scraper/**"
      - ".github/workflows/job-scraper.yml"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: job-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: job-scraper/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Scrape
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m jobscraper.main ${{ github.event_name == 'push' && '--dry-run' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-csv
          path: job-scraper/output/*.csv
          retention-days: 30
